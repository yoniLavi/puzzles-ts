<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The Hintful Puzzles mark: a puzzle grid with one cell lit.
    Drawn for this project; not derived from any other logo. Also the source
    of every generated PWA icon (vite.config.ts, pwaAssets), so it carries its
    own background and reads at 16 px.
  -->
  <title>Hintful Puzzles</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1f4e8c"/>
  <g fill="#e8f3ff">
    <rect x="10"   y="10"   width="13" height="13" rx="3"/>
    <rect x="25.5" y="10"   width="13" height="13" rx="3"/>
    <rect x="41"   y="10"   width="13" height="13" rx="3"/>
    <rect x="10"   y="25.5" width="13" height="13" rx="3"/>
    <rect x="41"   y="25.5" width="13" height="13" rx="3"/>
    <rect x="10"   y="41"   width="13" height="13" rx="3"/>
    <rect x="25.5" y="41"   width="13" height="13" rx="3"/>
    <rect x="41"   y="41"   width="13" height="13" rx="3"/>
  </g>
  <rect x="25.5" y="25.5" width="13" height="13" rx="3" fill="#ffc83d"/>
</svg>
