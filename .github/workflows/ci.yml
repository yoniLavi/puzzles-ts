# CI backstop for this project.
#
# Trunk-based (no PRs), so the gate runs post-push on `main`: it runs the SAME
# gate as the husky pre-commit hook (`npm run gate`: tsgo over both projects →
# biome ci → probe-anchor check → vitest run → vite build), so a `--no-verify` commit or
# a fresh clone whose hooks never installed can no longer land breakage on
# `main` undetected. (If contributors arrive later and PRs become useful, add a
# `pull_request:` trigger here.)
#
# Nothing is generated, so this job is `npm ci` and the gate. It used to say the
# opposite — "no cheap no-WASM tier", because `src/puzzle/{catalog,types,worker}.ts`
# imported artifacts out of `src/assets/puzzles/` — and it carried an emsdk
# setup, apt packages, a `build:wasm` step and a cache of the wasm output keyed
# on `hashFiles('puzzles/**')` to keep all that off the critical path.
# `retire-c-engine` deleted the C engine: the catalog is committed source
# (`src/puzzle/catalog-data.ts`) and the types are hand-authored. An apt install
# of halibut and a `build:assets` step outlived it by one change, to build the
# in-app manual; `retire-the-upstream-help-tree` deleted the manual, so the last
# native tool and the last generated artifact went with it. There is no longer
# any tool to provision here, on any platform.
name: CI

on:
  push:
    branches: [main]
  # Manual trigger — run the gate on demand.
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref — the
# older run's result is moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Current LTS-track major; matches the local dev environment. (This
          # used to be pinned by a hard requirement — the deleted
          # `vite-plugins/wasm-sourcemaps.ts` used `RegExp.escape`, which needs
          # V8 in Node 24, and `vite build` failed on Node 22. That plugin went
          # with the wasm it patched, so the pin is now a preference.)
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run the gate (typecheck → lint/format → test → prod build)
        run: npm run gate
