# CI backstop for this project.
#
# Trunk-based (no PRs), so the gate runs post-push on `main`: it runs the SAME
# gate as the husky pre-commit hook (`npm run gate`: tsc -b --noEmit → biome ci
# → vitest run → vite build), so a `--no-verify` commit or a fresh clone whose
# hooks never installed can no longer land breakage on `main` undetected. (If
# contributors arrive later and PRs become useful, add a `pull_request:` trigger
# here.)
#
# The gate needs NO generated assets. This workflow used to say the opposite —
# "no cheap no-WASM tier", because `src/puzzle/{catalog,types,worker}.ts`
# imported artifacts out of `src/assets/puzzles/` — and it carried an emsdk
# setup, apt packages, a `build:wasm` step and a cache of the wasm output keyed
# on `hashFiles('puzzles/**')` to keep all that off the critical path.
# `retire-c-engine` deleted the C engine: the catalog is committed source
# (`src/puzzle/catalog-data.ts`) and the types are hand-authored, so a clean
# checkout type-checks, tests and builds with nothing generated at all. The
# whole apparatus went, and the run is faster for it.
#
# The manual build stays, and is the one thing here that is NOT a gate
# precondition. `npm run build:assets` (halibut over `puzzles/puzzles.but`) is
# the only generated asset left; running it is what exercises
# `scripts/build-manual.sh` and vite's manual-page rendering path, which no test
# covers. If it is ever dropped, the gate still passes — the manual pages are
# simply absent from `dist/help/manual/`.
name: CI

on:
  push:
    branches: [main]
  # Manual trigger — run the gate on demand.
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref — the
# older run's result is moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Current LTS-track major; matches the local dev environment. (This
          # used to be pinned by a hard requirement — the deleted
          # `vite-plugins/wasm-sourcemaps.ts` used `RegExp.escape`, which needs
          # V8 in Node 24, and `vite build` failed on Node 22. That plugin went
          # with the wasm it patched, so the pin is now a preference.)
          node-version: 24
          cache: npm

      # halibut builds the in-app manual (see the header note). It is the only
      # native tool this project still needs, and the only one in the Brewfile.
      - name: Install halibut (in-app manual)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends halibut

      - name: Install npm dependencies
        run: npm ci

      - name: Build the in-app manual
        run: npm run build:assets

      - name: Run the gate (typecheck → lint/format → test → prod build)
        run: npm run gate
