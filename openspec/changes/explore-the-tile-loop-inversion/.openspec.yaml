# No spec deltas: this change's deliverable is a measurement and a go/no-go on
# `docs/framework-rdd/presentation.md`'s tile renderer. Writing a requirement now
# would be the "instrument before the finding" error the exploration exists to
# avoid — the vision's "~80 lines of identical bookkeeping per game" has never
# been measured, and three of the definition end's five rows were withdrawn by
# exactly this kind of check.
#
# If the exploration survives its own falsifier, this change is rewritten as a
# ready one and carries the deltas then; if it does not, the record is a
# postmortem under `openspec/postmortems/` and there is nothing normative to say.
#
# `schema` is required for this file to be valid change metadata at all — without
# it the `skip_specs` marker parses but is *not honored*, and `validate` says so
# rather than passing. It names the same workflow as `openspec/config.yaml`.
schema: spec-driven
skip_specs: true
