# `schema` is required for this file to be valid change metadata at all — without
# it the workflow marker parses but is *not honored*, and `validate` says so
# rather than passing. It names the same workflow as `openspec/config.yaml`.
schema: spec-driven

# This began as `skip_specs: true`, reasoning that the `sixteen` spec already
# required a hint that reaches a solved board, so nothing had to be written down
# before the code could obey it. That was right about the outcome and wrong about
# the change: the fix establishes a *mechanism* with a rule attached to it — a
# search that may reach exactly one ply further than the ungated one, and no more
# — and a rule that has to be obeyed by whoever tunes it next belongs in a spec
# rather than only in a comment. The `ts-engine` delta carries it, along with the
# completeness obligation the half-blind hash taught, and a modification to the
# hint walk's slice rule for the second sweep found with the same blind spot.
#
# `netslide` needs no delta: measured over 108 walked games across all nine
# presets, it never strands, so it configures no deep search and nothing about
# its requirement changes.
