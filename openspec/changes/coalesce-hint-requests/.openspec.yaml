# `schema` is required for this file to be valid change metadata at all — without
# it the workflow marker parses but is *not honored*, and `validate` says so
# rather than passing. It names the same workflow as `openspec/config.yaml`.
schema: spec-driven

# No deltas yet, and this one genuinely should not have them: what the app does
# while a hint is being computed is a design question with the owner in it, and
# writing a requirement before that is decided would be recording a guess. A
# delta becomes right once task 2 has an answer.
skip_specs: true
