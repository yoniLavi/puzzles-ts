# `schema` is required for this file to be valid change metadata at all — without
# it the workflow marker parses but is *not honored*, and `validate` says so
# rather than passing. It names the same workflow as `openspec/config.yaml`.
schema: spec-driven

# This started out `skip_specs: true`, on the reasoning that the `sixteen` spec
# already required what was broken — a hint that reaches a solved board — so the
# change only had to make the code obey a requirement that was written.
#
# That was wrong, and finding out why was most of the work. Both the `sixteen`
# spec and the `ts-engine` planner requirement did not merely fail to forbid the
# defect: they **mandated it**, in as many words ("only when that makes no
# progress at all on a near-solved board … without engaging the exact search").
# The fix therefore contradicts written requirements in two capabilities, and a
# third — the hint walk's per-commit slice — states a rule with the blind spot
# that let the defect survive a round of widening.
#
# `netslide` needs no delta: its requirement asks for an exact shortest search
# for the endgame and is satisfied more completely than before.
