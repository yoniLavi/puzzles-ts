# `schema` is required for this file to be valid change metadata at all — without
# it the `skip_specs` marker parses but is *not honored*, and `validate` says so
# rather than passing. It names the same workflow as `openspec/config.yaml`.
schema: spec-driven

# No deltas *yet*, and the reason is specific to this change rather than
# boilerplate: Tracks will get a `tracks` capability requirement, and it is
# already listed in the proposal's Impact. What cannot be written before the work
# is the requirement's *scenarios*, because they describe the deductions the hint
# actually narrates and the vocabulary it uses — and this change exists precisely
# to find out what that costs. Writing them now would publish an answer the
# measurement is supposed to produce.
#
# **The delta lands in this same change**, at implementation (tasks §4.4), and
# this marker is deleted with it. A change that archives still carrying this
# comment has skipped a deliverable.
skip_specs: true
