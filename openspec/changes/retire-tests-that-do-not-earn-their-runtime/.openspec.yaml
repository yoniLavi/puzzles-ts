# The audit has an answer to defend, so the delta exists and `skip_specs` is
# gone (it was set while task 0 was a measurement, because writing a normative
# rule over an unmeasured population is the "instrument before the finding"
# error this repo keeps catching).
#
# The delta lands in `build-pipeline` rather than the `repo-layout` /
# `ts-migration` the tasks guessed at: `build-pipeline` already owns "The commit
# gate's cost is proportional to what it protects" from `right-size-the-test-gate`,
# and that requirement covers *deferral* only. The retirement bar, the
# measurement discipline and the slow tier's invocability are the same concern.
#
# `schema` names the same workflow as `openspec/config.yaml`.
schema: spec-driven
